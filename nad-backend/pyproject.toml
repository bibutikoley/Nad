[project]
name = "nad-backend"
version = "0.1.0"
description = "Nad voice agent worker (LiveKit Agents, self-hosted)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[openai]~=1.7.1",
    "python-dotenv~=1.1",
]

[dependency-groups]
# token_server.py only needs these — not livekit-agents and its ~200 MB of unused
# STT/TTS/VAD deps (av, numpy, sounddevice, PIL, ...). Used by Dockerfile's
# `uv sync --only-group token-server` so the container image stays small.
token-server = [
    "livekit-api~=1.0",
    "aiohttp~=3.12",
    "python-dotenv~=1.1",
]

# test_noise_gate.py only. Not in the default deps so `lk agent start` and the
# Docker image never pull pytest.
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
