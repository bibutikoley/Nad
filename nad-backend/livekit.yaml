# Local development config for the self-hosted LiveKit server.
# Keys here must match LIVEKIT_API_KEY / LIVEKIT_API_SECRET in .env.
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 50100
  use_external_ip: false
keys:
  devkey: devsecret_change_me_at_least_32_chars
logging:
  level: info
