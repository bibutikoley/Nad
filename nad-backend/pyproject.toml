[project]
name = "nad-backend"
version = "0.1.0"
description = "Nad voice agent worker (LiveKit Agents, self-hosted)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "livekit-agents[openai]~=1.7.1",
    "python-dotenv~=1.1",
]

[dependency-groups]
# token_server.py only needs these — not livekit-agents and its ~200 MB of unused
# STT/TTS/VAD deps (av, numpy, sounddevice, PIL, ...). Used by Dockerfile's
# `uv sync --only-group token-server` so the container image stays small.
token-server = [
    "livekit-api~=1.0",
    "aiohttp~=3.12",
    "python-dotenv~=1.1",
]

# Tests only. Not in the default deps so `lk agent start` and the Docker image
# never pull pytest.
dev = [
    "pytest~=8.4",
    "pytest-asyncio~=1.0",
]

# There is deliberately no group for stt_server.py's runtime (omi-med-stt[mlx]).
# mlx ships wheels only for macos-arm64 and `uv lock` resolves universally, so a
# group here would make uv.lock unresolvable for the linux token-server image
# (Dockerfile: `uv sync --locked --only-group token-server`). It would also drag
# librosa/numba, transformers and a numpy<2.3 ceiling into the venv that
# `lk agent dev` hot-reloads, and put omi's process-global ConformerBlock
# monkey-patch in the worker's own process. Same reason mlx-audio isn't here: the
# pins live in scripts/stt-server.sh, next to the command that installs them.

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
